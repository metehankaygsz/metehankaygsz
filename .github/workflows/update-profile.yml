name: Update profile README

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-profile.yml"
      - "scripts/generate-profile.mjs"
      - "WHATS_NEW.md"

permissions:
  contents: write

concurrency:
  group: update-profile-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Generate profile README
        run: node scripts/generate-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
          # Every value below is optional and read from repository variables,
          # so a fork works unchanged. Set them under
          # Settings > Secrets and variables > Actions > Variables.
          #
          #   PROFILE_UTC_OFFSET   hours from UTC for the commit clock (e.g. 3)
          #   PROFILE_LOCALE       date and number formatting (e.g. en, tr)
          #   PROFILE_ACCENT_COLOR hex for the location badge, no leading "#"
          #   SPOTIFY_STATUS_URL   now-playing image; section hidden if unset
          #   SPOTIFY_PROFILE_URL  link target for the now-playing badge
          PROFILE_UTC_OFFSET: ${{ vars.PROFILE_UTC_OFFSET }}
          PROFILE_LOCALE: ${{ vars.PROFILE_LOCALE }}
          PROFILE_ACCENT_COLOR: ${{ vars.PROFILE_ACCENT_COLOR }}
          SPOTIFY_STATUS_URL: ${{ vars.SPOTIFY_STATUS_URL }}
          SPOTIFY_PROFILE_URL: ${{ vars.SPOTIFY_PROFILE_URL }}

      - name: Commit changed profile data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets

          # Staging first so newly generated, still-untracked SVGs are seen.
          if git diff --cached --quiet; then
            echo "Profile data has not changed."
            exit 0
          fi

          git commit -m "chore: refresh profile README"
          git push
